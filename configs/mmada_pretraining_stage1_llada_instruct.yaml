# Configuration for Chem-MMaDA Pretraining Stage 1 (Molecular and Text Understanding)

# --- Model Parameters ---
model:
  llm_config_path: "llada-8b-instruct"
  llm_model_name_or_path: "GSAI-ML/LLaDA-8B-Instruct"
  freeze_llm: true

  # Molecular 3D Encoder
  mol_atom_embedding_dim: 128
  mol_coord_embedding_dim: 128
  mol_3d_encoder_output_dim: 768
  num_atom_types: 120
  max_atoms: 128
  max_selfies_length: 256
  output_atom_coords_dim: 3
  output_atom_type_dim: 120

  # Fusion network
  d_model: 4096
  fusion_hidden_dim: 2048
  final_condition_dim: 768

  # Diffusion
  diffusion_timesteps: 1000
  noise_schedule_beta_start: 0.0001
  noise_schedule_beta_end: 0.02
  noise_schedule_name: "linear"

  # Loss coefficients
  lm_coeff:        1.0
  diff_coeff:      1.0
  mae_coeff:       1.0
  atom_type_coeff: 1.0

  # Discrete diffusion masking (atom types)
  mask_token_id: 120
  mask_replace_ratio: 0.5
  mask_schedule_name: "linear"
  mask_schedule_start: 0.25
  mask_schedule_end: 0.75

  # Data
  data_path: "/projects/bezp/yfeng7/data/m3_molecular_data.parquet"
  selfies_mask_ratio: null
  atom_type_mask_prob: 0.3
  include_edge_bond_dist: true
  include_rdmol2selfies: false

# --- Dataset ---
dataset:
  preprocessing:
    max_text_length: 512
  params:
    shuffle_buffer_size: 100
    num_workers: 8
    pin_memory: true
    persistent_workers: false

# --- Training ---
training:
  max_train_steps: 100000
  gradient_accumulation_steps: 16
  mixed_precision: "bf16"
  batch_size: 8
  seed: 42
  overfit_one_batch: false
  max_grad_norm: 1.0

# --- Optimizer ---
optimizer:
  name: "AdamW"
  params:
    learning_rate: 1.0e-5
    weight_decay: 0.01
    beta1: 0.9
    beta2: 0.95
    eps: 1.0e-08

# --- LR Scheduler ---
lr_scheduler:
  scheduler: "cosine"
  params:
    warmup_steps: 1000
    min_lr_scale: 0.05

# --- Experiment / Logging / Checkpointing ---
experiment:
  name: "chem-mmada-pretrain-stage1"
  project: "Chem-MMaDA"
  output_dir: "/work/hdd/bezp/yfeng7/outputs/mmada-training-stage2-llada-instruct"
  log_every: 100
  eval_every: 5000
  save_every: 5000
  checkpoints_total_limit: 5
  log_grad_norm_every: 100
  resume_from_checkpoint: false
